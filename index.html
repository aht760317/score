<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗六顧德補習班 - 段考成績登錄系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        /* 試算表格子輸入框外觀 */
        .grid-cell-input { width: 100%; height: 100%; padding: 0.5rem 0.4rem; border: 1px solid transparent; background: transparent; outline: none; font-size: 0.925rem; transition: all 0.15s ease; border-radius: 0; }
        .grid-cell-input:focus { background-color: #eff6ff; border-color: #3b82f6; box-shadow: inset 0 0 0 1.5px #3b82f6; border-radius: 4px; font-weight: 700; position: relative; z-index: 5; }
        .table-sticky-header th { position: sticky; top: 0; z-index: 10; }
        /* 自訂捲軸 */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        /* 隱藏側邊欄底下的遮罩 */
        #sidebarOverlay.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="h-screen flex text-slate-800 bg-slate-50 overflow-hidden relative">

    <!-- 主工作區 (左側) -->
    <div class="flex-1 flex flex-col h-full overflow-hidden transition-all duration-300">
        
        <!-- 頂部導航與設定列 -->
        <header class="bg-indigo-900 text-white shadow-md z-20 shrink-0">
            <div class="px-4 py-3">
                <!-- 標題與操作按鈕 -->
                <div class="flex flex-wrap items-center justify-between gap-3 border-b border-indigo-800/80 pb-3">
                    <div class="flex items-center gap-2.5">
                        <div class="w-9 h-9 rounded-xl bg-amber-400 flex items-center justify-center text-indigo-950 font-black shadow">顧</div>
                        <h1 class="text-lg font-black tracking-wide flex items-center gap-2">
                            <span>斗六顧德補習班</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 font-bold border border-amber-400/30">系統首頁</span>
                        </h1>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition shadow">
                            <i data-lucide="sheet" class="w-3.5 h-3.5"></i>匯出 Excel
                        </button>
                        <button onclick="saveCurrentToHistory()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition shadow">
                            <i data-lucide="save" class="w-3.5 h-3.5"></i>儲存成績單
                        </button>
                        <button onclick="openHistoryModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-indigo-950 text-xs font-black transition shadow">
                            <i data-lucide="folder-open" class="w-3.5 h-3.5"></i>歷史紀錄
                        </button>
                        <div class="w-px h-6 bg-indigo-700 mx-1"></div>
                        <button onclick="toggleSidebar()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white border border-slate-600 text-xs font-bold transition">
                            <i data-lucide="settings-2" class="w-4 h-4 text-amber-300"></i>參數設定區
                        </button>
                    </div>
                </div>
                
                <!-- 全班共用參數快速列 (資料綁定 State) -->
                <div class="pt-2.5 grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs">
                    <div>
                        <label class="block text-indigo-200 font-bold mb-1">學年度 / 年次</label>
                        <select id="batchYear" onchange="updateMainField('batchYear', this.value)" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none cursor-pointer"></select>
                    </div>
                    <div>
                        <label class="block text-indigo-200 font-bold mb-1">月考 / 段考別</label>
                        <select id="batchExam" onchange="updateMainField('batchExam', this.value)" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none cursor-pointer"></select>
                    </div>
                    <div>
                        <label class="block text-indigo-200 font-bold mb-1">學校 (斗六地區)</label>
                        <input type="text" list="douliuSchoolList" id="batchSchool" onchange="updateMainField('batchSchool', this.value); applyDefaultSchoolToBlankRows()" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none" placeholder="輸入或選擇預設學校">
                        <datalist id="douliuSchoolList">
                            <option value="斗六國中"><option value="雲林國中"><option value="石榴國中"><option value="正心中學"><option value="維多利亞中學"><option value="斗六高中"><option value="斗六家商">
                        </datalist>
                    </div>
                    <div>
                        <label class="block text-indigo-200 font-bold mb-1">顧德班級 / 年級</label>
                        <input type="text" id="batchClass" onchange="updateMainField('batchClass', this.value)" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none" placeholder="例如：國二數理班">
                    </div>
                </div>
            </div>
        </header>

        <!-- 表格工具列與考科動態勾選區 -->
        <div class="px-4 pt-3 pb-2 flex flex-col gap-2.5 shrink-0 bg-slate-50 border-b border-slate-200">
            <div class="flex flex-wrap items-center justify-between gap-3">
                <div class="flex items-center gap-2">
                    <button onclick="addRow()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition shadow-sm"><i data-lucide="plus" class="w-3.5 h-3.5"></i>新增一列</button>
                    <button onclick="openPasteModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-white hover:bg-slate-100 text-slate-700 border border-slate-300 text-xs font-bold transition shadow-sm"><i data-lucide="clipboard-list" class="w-3.5 h-3.5 text-indigo-600"></i>批次貼上姓名</button>
                    <button onclick="autoCalculateRanks()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-400 hover:bg-amber-300 text-indigo-950 text-xs font-black transition shadow-sm"><i data-lucide="trophy" class="w-3.5 h-3.5"></i>自動排算名次與獎狀</button>
                </div>
                <div class="text-xs text-slate-500 flex items-center gap-3">
                    <span id="saveStatusIndicator" class="text-emerald-600 font-bold flex items-center gap-1 opacity-0 transition-opacity"><i data-lucide="check" class="w-3.5 h-3.5"></i>已儲存</span>
                    <span>目前在籍：<strong id="studentCountText" class="text-indigo-700 text-sm font-black">0</strong> 位</span>
                    <span class="text-slate-300">|</span>
                    <button onclick="clearAllDataConfirm()" class="text-rose-500 hover:text-rose-700 font-bold"><i data-lucide="trash-2" class="w-3.5 h-3.5 inline mr-1"></i>清空表格</button>
                </div>
            </div>
            
            <!-- 考科勾選 (直覺式增減欄位) -->
            <div class="bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm flex items-start gap-2 overflow-x-auto custom-scrollbar">
                <div class="text-xs font-bold text-slate-700 whitespace-nowrap mt-1"><i data-lucide="check-square" class="w-4 h-4 inline text-indigo-500 mr-1"></i>需登錄之考科：</div>
                <div id="activeSubjectsContainer" class="flex flex-wrap gap-2 min-w-max">
                    <!-- JS 動態生成 Checkboxes -->
                </div>
                <button onclick="toggleSidebar()" class="text-[11px] text-slate-400 hover:text-indigo-600 font-medium ml-auto mt-1 whitespace-nowrap underline underline-offset-2">找不到科目？去旁邊新增</button>
            </div>
        </div>

        <!-- 核心試算表格 (Excel 風格) -->
        <main class="px-4 py-3 flex-1 overflow-hidden flex flex-col bg-slate-50">
            <div class="bg-white rounded-xl shadow border border-slate-200 flex-1 overflow-hidden flex flex-col">
                <div class="overflow-auto flex-1 custom-scrollbar relative">
                    <table class="w-full text-left border-collapse table-sticky-header text-sm whitespace-nowrap">
                        <thead>
                            <tr class="bg-slate-100 text-slate-700 text-xs font-black uppercase tracking-wider shadow-sm border-b border-slate-200" id="tableHeaderRow">
                                <!-- JS 動態生成表頭 -->
                            </tr>
                        </thead>
                        <tbody id="studentTableBody" class="divide-y divide-slate-200 bg-white">
                            <!-- JS 動態生成資料列 -->
                        </tbody>
                    </table>
                </div>
                <div class="px-4 py-2 bg-slate-50 border-t border-slate-200 text-[11px] text-slate-400 font-medium flex items-center justify-between shrink-0">
                    <span>💡 提示：點選儲存格直接打字即可覆蓋；按 <kbd class="bg-white px-1 border rounded shadow-sm">Tab</kbd> 跳下一格，按 <kbd class="bg-white px-1 border rounded shadow-sm">Enter</kbd> 換下一列。</span>
                </div>
            </div>
        </main>
    </div>

    <!-- 側邊欄遮罩 (行動版/平板時顯示) -->
    <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-30 opacity-0 pointer-events-none transition-opacity lg:hidden"></div>

    <!-- 參數設定側邊欄 (Settings Sidebar) -->
    <aside id="settingsSidebar" class="w-80 bg-white border-l border-slate-200 shadow-2xl flex flex-col absolute right-0 top-0 bottom-0 z-40 transform translate-x-full transition-transform duration-300 ease-in-out">
        <div class="bg-slate-800 text-white p-4 flex items-center justify-between shrink-0 shadow-md">
            <h2 class="font-bold flex items-center gap-2"><i data-lucide="settings-2" class="w-5 h-5 text-amber-300"></i>系統參數設定區</h2>
            <button onclick="toggleSidebar()" class="text-slate-300 hover:text-white bg-slate-700 p-1.5 rounded-lg transition"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        
        <div class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-6">
            <p class="text-[11px] text-slate-500 font-medium">您在此處新增或刪除的設定，將會自動出現在主畫面的下拉選單及考科區。設定將永遠保存在您的瀏覽器中。</p>
            
            <!-- 區塊 1: 學年度管理 -->
            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 shadow-sm">
                <h3 class="font-bold text-sm text-slate-800 mb-2 flex items-center gap-1.5"><i data-lucide="calendar" class="w-4 h-4 text-indigo-500"></i>學年度 / 年次管理</h3>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="newYearInput" placeholder="例如: 115上" class="flex-1 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter') addSettingsItem('yearsList', 'newYearInput')">
                    <button onclick="addSettingsItem('yearsList', 'newYearInput')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">加入</button>
                </div>
                <div id="yearsListContainer" class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar pr-1"></div>
            </div>

            <!-- 區塊 2: 月考/段考管理 -->
            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 shadow-sm">
                <h3 class="font-bold text-sm text-slate-800 mb-2 flex items-center gap-1.5"><i data-lucide="book-open" class="w-4 h-4 text-indigo-500"></i>月考 / 段考別管理</h3>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="newExamInput" placeholder="例如: 第一次月考" class="flex-1 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter') addSettingsItem('examsList', 'newExamInput')">
                    <button onclick="addSettingsItem('examsList', 'newExamInput')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">加入</button>
                </div>
                <div id="examsListContainer" class="space-y-1.5 max-h-36 overflow-y-auto custom-scrollbar pr-1"></div>
            </div>

            <!-- 區塊 3: 科目庫總管 -->
            <div class="bg-slate-50 rounded-xl p-3 border border-slate-200 shadow-sm">
                <h3 class="font-bold text-sm text-slate-800 mb-1.5 flex items-center gap-1.5"><i data-lucide="library" class="w-4 h-4 text-indigo-500"></i>科目庫總管</h3>
                <p class="text-[10px] text-slate-500 mb-2.5 leading-tight">新增後的科目會出現在主畫面，打勾後即可在表格填分。</p>
                <div class="flex gap-2 mb-3">
                    <input type="text" id="newSubjectInput" placeholder="例如: 作文、公民" class="flex-1 border border-slate-300 rounded-lg px-2.5 py-1.5 text-xs outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter') addSettingsItem('allAvailableSubjects', 'newSubjectInput')">
                    <button onclick="addSettingsItem('allAvailableSubjects', 'newSubjectInput')" class="bg-indigo-100 hover:bg-indigo-200 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-bold transition">加入</button>
                </div>
                <!-- 科目用標籤雲樣式呈現 -->
                <div id="subjectsListContainer" class="flex flex-wrap gap-2 max-h-56 overflow-y-auto custom-scrollbar pr-1 pt-1"></div>
            </div>
        </div>
    </aside>

    <!-- 彈窗 1：整班學生姓名批次貼上 -->
    <div id="pasteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 space-y-3">
            <div class="flex items-center justify-between border-b pb-2">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i data-lucide="clipboard" class="w-4 h-4 text-indigo-600"></i>批次貼上學生姓名
                </h3>
                <button onclick="closePasteModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            <p class="text-xs text-slate-500">請將學生名冊直接複製後貼在下方（一行一位），系統將自動建立輸入列：</p>
            <textarea id="pasteNamesTextarea" rows="8" placeholder="林宥辰&#10;張語彤&#10;陳品睿" class="w-full border border-slate-300 rounded-xl p-3 text-xs leading-relaxed outline-none focus:border-indigo-500 font-mono"></textarea>
            <div class="flex items-center justify-between pt-2">
                <label class="flex items-center gap-1.5 text-xs text-slate-600 font-medium cursor-pointer">
                    <input type="checkbox" id="overwriteExistingCheckbox" class="rounded text-indigo-600"><span>清空現有表格並取代</span>
                </label>
                <button onclick="confirmBatchPaste()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold">匯入表格</button>
            </div>
        </div>
    </div>

    <!-- 彈窗 2：歷史紀錄讀取 -->
    <div id="historyModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="p-2 rounded-xl bg-amber-100 text-amber-600"><i data-lucide="folder-open" class="w-5 h-5"></i></span>
                    <h3 class="font-black text-lg text-slate-800">歷史成績紀錄管理</h3>
                </div>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 p-1"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto pr-2">
                <div id="historyListContainer" class="space-y-3"></div>
            </div>
        </div>
    </div>

    <!-- 訊息提示 (Toast) -->
    <div id="toastMessage" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 z-50 flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-amber-400"></i><span id="toastText">訊息</span>
    </div>

    <!-- Javascript 系統核心 -->
    <script>
        const STORAGE_KEY = 'douliu_goode_v4_state';
        const HISTORY_KEY = 'douliu_goode_v4_history';

        // 核心狀態物件
        let state = {
            yearsList: ['113學年度第一學期', '113學年度第二學期', '114學年度第一學期'],
            examsList: ['第一次段考', '第二次段考', '第三次段考', '期中考', '期末考', '模擬考'],
            allAvailableSubjects: ['國文', '數學', '英文', '物理', '化學', '理化', '歷史', '地理', '公民', '生物', '地科'],
            
            // 當前表格屬性
            batchYear: '113學年度第一學期',
            batchExam: '第一次段考',
            batchSchool: '斗六國中',
            batchClass: '國二數理班',
            activeSubjects: ['國文', '數學', '英文', '理化', '歷史', '地理'],
            studentRows: []
        };

        let autoSaveTimer = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            if (state.studentRows.length === 0) {
                // 給予初始假資料展示
                state.studentRows = [
                    { seat: 1, name: '林宥辰', school: '斗六國中', scores: { '國文': 96, '數學': 100, '英文': 98, '理化': 98 }, classRank: '', schoolRank: '', cert: '無' },
                    { seat: 2, name: '張語彤', school: '正心中學', scores: { '國文': 90, '數學': 92, '英文': 94, '理化': 90 }, classRank: '', schoolRank: '', cert: '無' }
                ];
            }
            renderAllUI();
            lucide.createIcons();
        });

        // ================= 資料流與存檔 =================
        function loadState() {
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    const parsed = JSON.parse(stored);
                    state = { ...state, ...parsed }; // 合併資料，保留新增結構
                }
            } catch (e) { console.error('Load state failed', e); }
        }

        function triggerSave() {
            clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                const ind = document.getElementById('saveStatusIndicator');
                if(ind) {
                    ind.classList.remove('opacity-0');
                    setTimeout(() => ind.classList.add('opacity-0'), 2000);
                }
            }, 500); // Debounce 500ms
        }

        // ================= 畫面渲染統籌 =================
        function renderAllUI() {
            renderSidebarSettings();
            renderTopDropdowns();
            syncTopInputs();
            renderActiveSubjectCheckboxes();
            renderTable();
        }

        // 1. 渲染頂部下拉選單
        function renderTopDropdowns() {
            const yearSelect = document.getElementById('batchYear');
            yearSelect.innerHTML = state.yearsList.map(y => `<option value="${escapeHtml(y)}">${escapeHtml(y)}</option>`).join('');
            if(!state.yearsList.includes(state.batchYear) && state.yearsList.length > 0) state.batchYear = state.yearsList[0];
            yearSelect.value = state.batchYear;

            const examSelect = document.getElementById('batchExam');
            examSelect.innerHTML = state.examsList.map(e => `<option value="${escapeHtml(e)}">${escapeHtml(e)}</option>`).join('');
            if(!state.examsList.includes(state.batchExam) && state.examsList.length > 0) state.batchExam = state.examsList[0];
            examSelect.value = state.batchExam;
        }

        function syncTopInputs() {
            document.getElementById('batchSchool').value = state.batchSchool || '';
            document.getElementById('batchClass').value = state.batchClass || '';
        }

        function updateMainField(key, value) {
            state[key] = value;
            triggerSave();
        }

        // 2. 渲染主畫面考科 Checkboxes
        function renderActiveSubjectCheckboxes() {
            const container = document.getElementById('activeSubjectsContainer');
            // 清理已不在 pool 裡的 activeSubjects
            state.activeSubjects = state.activeSubjects.filter(sub => state.allAvailableSubjects.includes(sub));

            container.innerHTML = state.allAvailableSubjects.map(sub => {
                const isChecked = state.activeSubjects.includes(sub);
                return `
                    <label class="flex items-center gap-1.5 px-2.5 py-1 rounded-md border ${isChecked ? 'bg-indigo-50 border-indigo-300 text-indigo-800 font-bold' : 'bg-slate-50 border-slate-200 text-slate-500'} cursor-pointer select-none transition-colors">
                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSubjectActive('${escapeHtml(sub)}', this.checked)" class="rounded text-indigo-600 w-3.5 h-3.5">
                        <span class="text-xs">${escapeHtml(sub)}</span>
                    </label>
                `;
            }).join('');
        }

        function toggleSubjectActive(subject, isChecked) {
            if (isChecked && !state.activeSubjects.includes(subject)) {
                state.activeSubjects.push(subject);
            } else if (!isChecked) {
                state.activeSubjects = state.activeSubjects.filter(s => s !== subject);
            }
            triggerSave();
            renderActiveSubjectCheckboxes();
            renderTable(); // 重繪表格欄位
        }

        // 3. 渲染側邊欄清單
        function renderSidebarSettings() {
            // 學年度
            document.getElementById('yearsListContainer').innerHTML = state.yearsList.map(y => `
                <div class="flex items-center justify-between p-2 bg-white rounded border border-slate-100 text-xs">
                    <span class="font-medium text-slate-700">${escapeHtml(y)}</span>
                    <button onclick="removeSettingsItem('yearsList', '${escapeHtml(y)}')" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
            `).join('');
            
            // 段考
            document.getElementById('examsListContainer').innerHTML = state.examsList.map(e => `
                <div class="flex items-center justify-between p-2 bg-white rounded border border-slate-100 text-xs">
                    <span class="font-medium text-slate-700">${escapeHtml(e)}</span>
                    <button onclick="removeSettingsItem('examsList', '${escapeHtml(e)}')" class="text-slate-300 hover:text-rose-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                </div>
            `).join('');

            // 科目 (使用 Tag 樣式)
            document.getElementById('subjectsListContainer').innerHTML = state.allAvailableSubjects.map(s => `
                <div class="flex items-center gap-1 px-2 py-1 bg-white border border-slate-200 rounded-md text-xs shadow-sm group">
                    <span class="font-medium text-slate-700">${escapeHtml(s)}</span>
                    <button onclick="removeSettingsItem('allAvailableSubjects', '${escapeHtml(s)}')" class="text-slate-300 hover:text-rose-500 opacity-50 group-hover:opacity-100"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                </div>
            `).join('');
            
            lucide.createIcons();
        }

        function addSettingsItem(listKey, inputId) {
            const input = document.getElementById(inputId);
            const val = input.value.trim();
            if (!val) return;
            if (!state[listKey].includes(val)) {
                state[listKey].push(val);
                input.value = '';
                triggerSave();
                renderAllUI();
                showToast(`已新增：「${val}」`);
            } else {
                showToast('此項目已存在！');
            }
        }

        function removeSettingsItem(listKey, val) {
            if(confirm(`確定要刪除「${val}」嗎？`)) {
                state[listKey] = state[listKey].filter(item => item !== val);
                triggerSave();
                renderAllUI();
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('settingsSidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('translate-x-full');
            if(overlay) overlay.classList.toggle('active');
        }

        // ================= 表格核心渲染 =================
        function renderTable() {
            document.getElementById('studentCountText').textContent = state.studentRows.length;

            const headerRow = document.getElementById('tableHeaderRow');
            let headerHtml = `
                <th class="py-2.5 px-2 text-center w-12 border-r border-slate-200">座號</th>
                <th class="py-2.5 px-3 min-w-[110px] border-r border-slate-200">學生姓名</th>
                <th class="py-2.5 px-3 min-w-[110px] border-r border-slate-200">學校</th>
            `;
            state.activeSubjects.forEach(sub => {
                headerHtml += `<th class="py-2 px-2 text-center min-w-[70px] border-r border-slate-200 bg-indigo-50/80 text-indigo-900">${escapeHtml(sub)}</th>`;
            });
            headerHtml += `
                <th class="py-2.5 px-2 text-center min-w-[65px] border-r border-slate-200">總分</th>
                <th class="py-2.5 px-2 text-center min-w-[65px] border-r border-slate-200 bg-amber-50 text-amber-900">平均</th>
                <th class="py-2.5 px-2 text-center min-w-[60px] border-r border-slate-200">班排</th>
                <th class="py-2.5 px-2 text-center min-w-[60px] border-r border-slate-200">校排</th>
                <th class="py-2.5 px-2 text-center min-w-[100px] border-r border-slate-200 bg-amber-50 text-amber-900">獎狀標記</th>
                <th class="py-2.5 px-2 text-center w-10">✕</th>
            `;
            headerRow.innerHTML = headerHtml;

            const tbody = document.getElementById('studentTableBody');
            if (state.studentRows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${state.activeSubjects.length + 9}" class="py-12 text-center text-slate-400 font-bold">表格是空的。請點擊「新增一列」開始輸入。</td></tr>`;
                return;
            }

            const defaultSchool = state.batchSchool || '斗六國中';

            tbody.innerHTML = state.studentRows.map((row, rIdx) => {
                let total = 0, count = 0;
                state.activeSubjects.forEach(sub => {
                    const val = parseFloat(row.scores?.[sub]);
                    if (!isNaN(val)) { total += val; count++; }
                });
                const avg = count > 0 ? (total / count).toFixed(1) : '-';

                const subjectCols = state.activeSubjects.map(sub => {
                    const scoreVal = row.scores?.[sub] !== undefined ? row.scores[sub] : '';
                    let color = 'text-slate-800';
                    if (parseFloat(scoreVal) === 100) color = 'text-rose-600 font-black';
                    else if (parseFloat(scoreVal) >= 90) color = 'text-emerald-600 font-bold';

                    return `
                        <td class="p-0 border-r border-slate-200 text-center">
                            <input type="number" step="0.5" min="0" max="100" value="${scoreVal}" placeholder="-"
                                onfocus="this.select()"
                                onkeydown="handleCellKeyNavigation(event, ${rIdx})"
                                oninput="updateScore(${rIdx}, '${escapeHtml(sub)}', this.value)"
                                class="grid-cell-input text-center ${color}">
                        </td>
                    `;
                }).join('');

                return `
                    <tr class="hover:bg-blue-50/30 transition-colors">
                        <td class="p-0 border-r border-slate-200 text-center"><input type="number" value="${row.seat !== undefined ? row.seat : (rIdx + 1)}" onfocus="this.select()" onchange="updateRowField(${rIdx}, 'seat', this.value)" class="grid-cell-input text-center text-slate-500 font-semibold bg-slate-50/50"></td>
                        <td class="p-0 border-r border-slate-200"><input type="text" value="${escapeHtml(row.name || '')}" placeholder="姓名" onfocus="this.select()" onkeydown="handleCellKeyNavigation(event, ${rIdx})" onchange="updateRowField(${rIdx}, 'name', this.value)" class="grid-cell-input font-bold text-slate-900"></td>
                        <td class="p-0 border-r border-slate-200"><input type="text" list="douliuSchoolList" value="${escapeHtml(row.school || defaultSchool)}" onfocus="this.select()" onchange="updateRowField(${rIdx}, 'school', this.value)" class="grid-cell-input text-indigo-700 font-medium"></td>
                        ${subjectCols}
                        <td class="px-2 py-2 text-center font-bold text-slate-700 border-r border-slate-200 bg-slate-50/40">${count > 0 ? total : '-'}</td>
                        <td class="px-2 py-2 text-center font-black text-indigo-700 border-r border-slate-200 bg-amber-50/30">${avg}</td>
                        <td class="p-0 border-r border-slate-200 text-center"><input type="number" value="${row.classRank || ''}" placeholder="-" onfocus="this.select()" onchange="updateRowField(${rIdx}, 'classRank', this.value)" class="grid-cell-input text-center font-bold ${row.classRank == 1 ? 'text-amber-600 font-black' : 'text-slate-800'}"></td>
                        <td class="p-0 border-r border-slate-200 text-center"><input type="number" value="${row.schoolRank || ''}" placeholder="-" onfocus="this.select()" onchange="updateRowField(${rIdx}, 'schoolRank', this.value)" class="grid-cell-input text-center text-slate-600"></td>
                        <td class="px-1.5 py-1 text-center border-r border-slate-200 bg-amber-50/10">
                            <select onchange="updateRowField(${rIdx}, 'cert', this.value)" class="text-xs rounded border border-amber-300 bg-white px-1.5 py-1 font-bold text-slate-700 outline-none w-full">
                                <option value="無" ${row.cert === '無' ? 'selected' : ''}>-</option>
                                <option value="第一名獎狀" ${row.cert === '第一名獎狀' ? 'selected' : ''}>🥇 第一名</option>
                                <option value="前三名獎狀" ${row.cert === '前三名獎狀' ? 'selected' : ''}>🏅 前三名</option>
                                <option value="優異獎狀" ${row.cert === '優異獎狀' ? 'selected' : ''}>🎖 優異獎</option>
                                <option value="進步獎" ${row.cert === '進步獎' ? 'selected' : ''}>📈 進步獎</option>
                            </select>
                        </td>
                        <td class="px-1 py-1 text-center">
                            <button onclick="deleteRow(${rIdx})" class="p-1.5 rounded text-slate-300 hover:text-rose-600 hover:bg-rose-50 transition" title="刪除"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
            lucide.createIcons();
        }

        // ================= 表格互動邏輯 =================
        function handleCellKeyNavigation(event, currentRowIdx) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const currentTd = event.target.closest('td');
                const colIdx = Array.from(currentTd.parentNode.children).indexOf(currentTd);
                const nextRow = currentTd.parentNode.nextElementSibling;
                if (nextRow && nextRow.children[colIdx]) {
                    const nextInput = nextRow.children[colIdx].querySelector('input');
                    if (nextInput) { nextInput.focus(); nextInput.select(); }
                } else if (!nextRow) {
                    addRow(); // 自動產生下一列
                }
            }
        }

        function updateScore(rIdx, subject, value) {
            if (!state.studentRows[rIdx]) return;
            if (!state.studentRows[rIdx].scores) state.studentRows[rIdx].scores = {};
            if (value === '') delete state.studentRows[rIdx].scores[subject];
            else state.studentRows[rIdx].scores[subject] = parseFloat(value);
            
            triggerSave();
            
            // 局部更新該列的總分與平均，不重繪整個表格提升效能
            let total = 0, count = 0;
            state.activeSubjects.forEach(sub => {
                const val = parseFloat(state.studentRows[rIdx].scores?.[sub]);
                if (!isNaN(val)) { total += val; count++; }
            });
            const tr = document.getElementById('studentTableBody').children[rIdx];
            if (tr) {
                const totalCell = tr.children[3 + state.activeSubjects.length];
                const avgCell = tr.children[4 + state.activeSubjects.length];
                if (totalCell) totalCell.textContent = count > 0 ? total : '-';
                if (avgCell) avgCell.textContent = count > 0 ? (total / count).toFixed(1) : '-';
            }
        }

        function updateRowField(rIdx, field, value) {
            state.studentRows[rIdx][field] = value;
            triggerSave();
        }

        function addRow() {
            state.studentRows.push({
                seat: state.studentRows.length + 1, name: '', school: state.batchSchool || '', scores: {}, classRank: '', schoolRank: '', cert: '無'
            });
            renderTable();
            triggerSave();
            // 自動 focus 新列的姓名欄
            setTimeout(() => {
                const inputs = document.querySelectorAll('input[placeholder="姓名"]');
                if(inputs.length > 0) inputs[inputs.length-1].focus();
            }, 50);
        }

        function deleteRow(idx) {
            state.studentRows.splice(idx, 1);
            state.studentRows.forEach((r, i) => r.seat = i + 1); // 重編座號
            renderTable();
            triggerSave();
        }

        function clearAllDataConfirm() {
            if(confirm('警告：確定要清空表格內所有的學生成績嗎？')) {
                state.studentRows = [];
                renderTable();
                triggerSave();
                showToast('已清空表格');
            }
        }

        function applyDefaultSchoolToBlankRows() {
            const s = state.batchSchool;
            state.studentRows.forEach(r => { if(!r.school) r.school = s; });
            renderTable();
        }

        function autoCalculateRanks() {
            if (state.studentRows.length === 0) return;
            state.studentRows.forEach(r => {
                let total = 0, count = 0;
                state.activeSubjects.forEach(sub => {
                    const val = parseFloat(r.scores?.[sub]);
                    if (!isNaN(val)) { total += val; count++; }
                });
                r._tempAvg = count > 0 ? (total / count) : -1;
            });

            const sorted = [...state.studentRows].filter(r => r._tempAvg >= 0).sort((a, b) => b._tempAvg - a._tempAvg);
            sorted.forEach((item, index) => {
                item.classRank = index + 1;
                if (item.classRank === 1 && (!item.cert || item.cert === '無')) item.cert = '第一名獎狀';
                else if (item.classRank <= 3 && (!item.cert || item.cert === '無')) item.cert = '前三名獎狀';
            });
            renderTable();
            triggerSave();
            showToast('已完成名次自動排序與獎狀標記！');
        }

        // ================= 批次貼上 =================
        function openPasteModal() { document.getElementById('pasteModal').classList.remove('hidden'); document.getElementById('pasteModal').classList.add('flex'); document.getElementById('pasteNamesTextarea').focus(); }
        function closePasteModal() { document.getElementById('pasteModal').classList.add('hidden'); document.getElementById('pasteModal').classList.remove('flex'); }
        
        function confirmBatchPaste() {
            const names = document.getElementById('pasteNamesTextarea').value.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            if(names.length === 0) return showToast('請輸入姓名！');
            if (document.getElementById('overwriteExistingCheckbox').checked) state.studentRows = [];
            
            const startSeat = state.studentRows.length + 1;
            names.forEach((name, idx) => {
                state.studentRows.push({ seat: startSeat + idx, name: name, school: state.batchSchool || '', scores: {}, classRank: '', schoolRank: '', cert: '無' });
            });
            
            document.getElementById('pasteNamesTextarea').value = '';
            closePasteModal();
            renderTable();
            triggerSave();
            showToast(`成功匯入 ${names.length} 位學生！`);
        }

        // ================= 歷史紀錄 =================
        function saveCurrentToHistory() {
            if (!state.batchYear || !state.batchExam || !state.batchSchool || !state.batchClass) {
                return showToast('請確認上方「學年度、段考別、學校、班級」皆已填寫完整！');
            }
            const recordId = `${state.batchYear}_${state.batchExam}_${state.batchSchool}_${state.batchClass}`;
            const recordData = {
                id: recordId, timestamp: Date.now(),
                year: state.batchYear, exam: state.batchExam, school: state.batchSchool, className: state.batchClass,
                activeSubjects: [...state.activeSubjects],
                studentRows: JSON.parse(JSON.stringify(state.studentRows))
            };

            let history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            const idx = history.findIndex(r => r.id === recordId);
            if (idx >= 0) {
                if(confirm(`紀錄「${recordId}」已存在，是否覆寫？`)) history[idx] = recordData;
                else return;
            } else {
                history.push(recordData);
            }
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            showToast(`已儲存成績單：${recordId}`);
        }

        function openHistoryModal() {
            document.getElementById('historyModal').classList.remove('hidden'); document.getElementById('historyModal').classList.add('flex');
            const container = document.getElementById('historyListContainer');
            const history = (JSON.parse(localStorage.getItem(HISTORY_KEY)) || []).sort((a,b) => b.timestamp - a.timestamp);
            
            if(history.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 font-bold">目前沒有儲存的歷史紀錄。</div>';
                return;
            }

            container.innerHTML = history.map(r => `
                <div class="flex items-center justify-between p-4 rounded-xl border border-slate-200 hover:bg-slate-50 transition">
                    <div>
                        <div class="flex gap-2 mb-1">
                            <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 text-[11px] font-black">${escapeHtml(r.year)}</span>
                            <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-700 text-[11px] font-black">${escapeHtml(r.exam)}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-sm">${escapeHtml(r.school)} - ${escapeHtml(r.className)}</h4>
                        <p class="text-[11px] text-slate-400">總計 ${r.studentRows.length} 位學生</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="loadHistoryRecord('${r.id}')" class="px-3 py-1.5 bg-indigo-600 text-white rounded-lg text-xs font-bold shadow-sm">讀取</button>
                        <button onclick="deleteHistoryRecord('${r.id}')" class="px-2.5 py-1.5 bg-white border border-rose-200 text-rose-500 rounded-lg shadow-sm hover:bg-rose-50"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }
        function closeHistoryModal() { document.getElementById('historyModal').classList.add('hidden'); document.getElementById('historyModal').classList.remove('flex'); }

        function loadHistoryRecord(id) {
            const history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            const r = history.find(x => x.id === id);
            if(!r) return;
            if(!confirm('讀取將覆蓋當前表格，確定？')) return;
            
            state.batchYear = r.year; state.batchExam = r.exam; state.batchSchool = r.school; state.batchClass = r.className;
            state.activeSubjects = [...r.activeSubjects];
            state.studentRows = JSON.parse(JSON.stringify(r.studentRows));
            
            // 確保歷史紀錄中的科目存在於總庫中
            r.activeSubjects.forEach(sub => { if(!state.allAvailableSubjects.includes(sub)) state.allAvailableSubjects.push(sub); });
            
            renderAllUI();
            triggerSave();
            closeHistoryModal();
            showToast(`已載入：${r.className}`);
        }

        function deleteHistoryRecord(id) {
            if(!confirm('確定永久刪除此紀錄？')) return;
            const history = (JSON.parse(localStorage.getItem(HISTORY_KEY)) || []).filter(x => x.id !== id);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            openHistoryModal();
        }

        // ================= 匯出 CSV =================
        function exportCSV() {
            if(state.studentRows.length === 0) return showToast('表格無資料！');
            const headers = ['座號', '姓名', '學校', ...state.activeSubjects, '總分', '平均', '班排名', '校排名', '獎狀紀錄'];
            const rows = state.studentRows.map((r, idx) => {
                let total = 0, count = 0;
                const subScores = state.activeSubjects.map(sub => {
                    const score = r.scores?.[sub] !== undefined ? r.scores[sub] : '';
                    if (score !== '') { total += parseFloat(score); count++; }
                    return score;
                });
                return [
                    r.seat !== undefined ? r.seat : (idx + 1), r.name || '', r.school || '',
                    ...subScores, count > 0 ? total : '', count > 0 ? (total/count).toFixed(1) : '',
                    r.classRank || '', r.schoolRank || '', r.cert || '無'
                ].map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',');
            });
            const csvContent = '\uFEFF' + headers.join(',') + '\r\n' + rows.join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
            a.download = `斗六顧德_${state.batchYear}_${state.batchExam}_${state.batchClass}.csv`;
            a.click(); URL.revokeObjectURL(a); showToast('已匯出 Excel！');
        }

        function showToast(text) {
            const t = document.getElementById('toastMessage');
            document.getElementById('toastText').textContent = text;
            t.classList.remove('opacity-0', 'translate-y-3');
            setTimeout(() => t.classList.add('opacity-0', 'translate-y-3'), 2500);
        }
        function escapeHtml(str) {
            return String(str||'').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
