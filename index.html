<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>斗六顧德補習班 - 段考成績快速登錄</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        /* 試算表格子輸入框外觀 */
        .grid-cell-input {
            width: 100%;
            height: 100%;
            padding: 0.5rem 0.35rem;
            border: 1px solid transparent;
            background: transparent;
            outline: none;
            font-size: 0.925rem;
            transition: all 0.15s ease;
        }
        .grid-cell-input:focus {
            background-color: #eff6ff;
            border-color: #3b82f6;
            box-shadow: inset 0 0 0 1px #3b82f6;
            border-radius: 4px;
            font-weight: 700;
        }
        .table-sticky-header th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- 頂部精簡導航與班級全域設定 -->
    <header class="bg-indigo-900 text-white shadow-md sticky top-0 z-20">
        <div class="max-w-[98%] mx-auto px-4 py-3">
            <div class="flex flex-wrap items-center justify-between gap-3 border-b border-indigo-800/80 pb-3">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-amber-400 flex items-center justify-center text-indigo-950 font-black shadow">
                        顧
                    </div>
                    <div>
                        <h1 class="text-lg font-black tracking-wide flex items-center gap-2">
                            <span>斗六顧德補習班</span>
                            <span class="text-xs px-2 py-0.5 rounded-full bg-amber-400/20 text-amber-300 font-bold border border-amber-400/30">段考整班快速登錄</span>
                        </h1>
                    </div>
                </div>

                <!-- 頂部操作鈕 -->
                <div class="flex items-center gap-2">
                    <button onclick="openSubjectModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-indigo-700 hover:bg-indigo-600 text-xs font-bold text-white transition border border-indigo-500/50">
                        <i data-lucide="sliders" class="w-3.5 h-3.5 text-amber-300"></i>
                        <span>設定考科 (<span id="subjectCountBadge">5</span>科)</span>
                    </button>
                    <button onclick="exportCSV()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition shadow">
                        <i data-lucide="sheet" class="w-3.5 h-3.5"></i>
                        <span>匯出 Excel</span>
                    </button>
                    <button onclick="saveCurrentToHistory()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold transition shadow">
                        <i data-lucide="save" class="w-3.5 h-3.5"></i>
                        <span>儲存當前成績單</span>
                    </button>
                    <button onclick="openHistoryModal()" class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-500 hover:bg-amber-400 text-indigo-950 text-xs font-black transition shadow">
                        <i data-lucide="folder-open" class="w-3.5 h-3.5"></i>
                        <span>讀取歷史成績</span>
                    </button>
                </div>
            </div>

            <!-- 全班共用參數快速列 (隨改即套用) -->
            <div class="pt-2.5 grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-5 gap-3 text-xs">
                <div>
                    <label class="block text-indigo-200 font-bold mb-1">學年度 / 學期</label>
                    <input type="text" id="batchYear" value="113學年度第一學期" onchange="autoSaveState()" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none">
                </div>
                <div>
                    <label class="block text-indigo-200 font-bold mb-1">段考別</label>
                    <select id="batchExam" onchange="autoSaveState()" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none">
                        <option value="第一次段考">第一次段考</option>
                        <option value="第二次段考">第二次段考</option>
                        <option value="第三次段考">第三次段考</option>
                        <option value="期中考">期中考</option>
                        <option value="期末考">期末考</option>
                        <option value="模擬考">模擬考</option>
                    </select>
                </div>
                <div>
                    <label class="block text-indigo-200 font-bold mb-1">預設學校 (斗六地區)</label>
                    <div class="relative">
                        <input list="douliuSchoolList" id="batchSchool" value="斗六國中" onchange="applyDefaultSchoolToBlankRows(); autoSaveState()" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none" placeholder="可選或自填學校">
                        <datalist id="douliuSchoolList">
                            <option value="斗六國中">
                            <option value="雲林國中">
                            <option value="石榴國中">
                            <option value="正心中學(國中)">
                            <option value="維多利亞中學">
                            <option value="鎮西國小">
                            <option value="公誠國小">
                            <option value="斗六國小">
                            <option value="鎮東國小">
                            <option value="雲林國小">
                            <option value="鎮南國小">
                            <option value="石榴國小">
                            <option value="溝壩國小">
                            <option value="梅林國小">
                            <option value="斗六高中">
                            <option value="正心中學(高中)">
                            <option value="斗六家商">
                        </datalist>
                    </div>
                </div>
                <div>
                    <label class="block text-indigo-200 font-bold mb-1">顧德班級 / 年級</label>
                    <input type="text" id="batchClass" value="國二數理旗艦班" onchange="autoSaveState()" class="w-full bg-indigo-950/70 border border-indigo-700 rounded-lg px-2.5 py-1.5 text-white font-medium focus:border-amber-400 outline-none" placeholder="例如：國一資優班、小五安親">
                </div>
                <div class="col-span-2 sm:col-span-4 lg:col-span-1 flex items-end">
                    <span class="text-[11px] text-indigo-300 font-normal">
                        💡 提示：在表格中打完數字直接按 <kbd class="bg-indigo-800 px-1 py-0.5 rounded text-amber-300 font-bold">Tab</kbd> 或 <kbd class="bg-indigo-800 px-1 py-0.5 rounded text-amber-300 font-bold">Enter</kbd> 可連續打下一位。
                    </span>
                </div>
            </div>
        </div>
    </header>

    <!-- 工具按鈕列 (大表格正上方) -->
    <div class="max-w-[98%] w-full mx-auto px-4 pt-4 pb-2 flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-2">
            <button onclick="addRow()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition shadow-sm">
                <i data-lucide="plus" class="w-4 h-4"></i>
                <span>新增一位學生</span>
            </button>
            <button onclick="addMultipleRows(5)" class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-white hover:bg-slate-50 text-indigo-700 border border-indigo-200 text-xs font-bold transition shadow-sm">
                <i data-lucide="user-plus" class="w-4 h-4"></i>
                <span>+ 快速加 5 位</span>
            </button>
            <button onclick="openPasteModal()" class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-xs font-bold transition shadow-sm">
                <i data-lucide="clipboard-list" class="w-4 h-4 text-indigo-600"></i>
                <span>批次貼上姓名清單</span>
            </button>
            <button onclick="autoCalculateRanks()" class="flex items-center gap-1.5 px-3.5 py-2 rounded-lg bg-amber-400 hover:bg-amber-300 text-indigo-950 text-xs font-black transition shadow-sm">
                <i data-lucide="trophy" class="w-4 h-4"></i>
                <span>依照平均自動算名次</span>
            </button>
        </div>

        <div class="flex items-center gap-3 text-xs text-slate-600">
            <span>目前在籍：<strong id="studentCountText" class="text-indigo-700 text-sm font-black">0</strong> 位</span>
            <span class="text-slate-300">|</span>
            <button onclick="clearAllDataConfirm()" class="text-rose-500 hover:text-rose-700 font-bold flex items-center gap-1">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>清空重新輸入
            </button>
        </div>
    </div>

    <!-- 核心大表格區 (Excel 試算表風格) -->
    <main class="max-w-[98%] w-full mx-auto px-4 pb-12 flex-1">
        <div class="bg-white rounded-xl shadow border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto max-h-[72vh]">
                <table class="w-full text-left border-collapse table-sticky-header text-sm">
                    <thead>
                        <tr class="bg-slate-100 text-slate-700 text-xs font-black uppercase tracking-wider border-b border-slate-200 shadow-sm" id="tableHeaderRow">
                            <!-- JS 動態生成表頭 -->
                        </tr>
                    </thead>
                    <tbody id="studentTableBody" class="divide-y divide-slate-200 bg-white">
                        <!-- JS 動態生成學生列 -->
                    </tbody>
                </table>
            </div>

            <!-- 表格底部快速新增列提示 -->
            <div class="px-4 py-2.5 bg-slate-50 border-t border-slate-200 flex items-center justify-between text-xs text-slate-500">
                <span>點擊「+ 新增一位學生」或「批次貼上姓名」即可直接擴充行數。資料隨時自動存檔於本機。</span>
                <span id="saveStatusIndicator" class="text-emerald-600 font-bold flex items-center gap-1">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i>已即時自動存檔
                </span>
            </div>
        </div>
    </main>

    <!-- 彈窗 1：考科自訂與勾選 -->
    <div id="subjectModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full p-5 shadow-2xl border border-slate-200 space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i data-lucide="sliders" class="w-4 h-4 text-indigo-600"></i>
                    考科管理與自由增減
                </h3>
                <button onclick="closeSubjectModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- 常用組合快捷選擇 -->
            <div class="flex flex-wrap items-center gap-1.5 text-xs text-slate-600 pb-2 border-b">
                <span class="font-bold text-slate-700">快速選擇：</span>
                <button onclick="applyPresetSubjects(['國文','數學','英文','物理','化學','理化','歷史','地理'])" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 border text-[11px] font-medium">全考科(8科)</button>
                <button onclick="applyPresetSubjects(['國文','英文','數學','自然','社會'])" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 border text-[11px] font-medium">會考五科</button>
                <button onclick="applyPresetSubjects(['數學','物理','化學','理化'])" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 border text-[11px] font-medium">理化數理組</button>
                <button onclick="applyPresetSubjects(['國文','英文','歷史','地理','公民'])" class="px-2 py-0.5 rounded bg-slate-100 hover:bg-indigo-50 hover:text-indigo-700 border text-[11px] font-medium">文史社會組</button>
            </div>

            <p class="text-xs text-slate-500">打勾即可將該科目加到表格；若不再需要可點擊科目標籤旁的「✕」將該科目徹底刪除：</p>
            
            <div id="subjectCheckboxes" class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-56 overflow-y-auto pr-1">
                <!-- 動態注入常用科目勾選與刪除按鈕 -->
            </div>

            <!-- 新增其他自訂科目 -->
            <div class="pt-3 border-t">
                <label class="block text-xs font-bold text-slate-700 mb-1.5">新增全新自訂考科：</label>
                <div class="flex gap-2">
                    <input type="text" id="newCustomSubjectInput" placeholder="例如：公民、生物、地科、作文" class="flex-1 rounded-lg border border-slate-300 px-3 py-1.5 text-xs outline-none focus:border-indigo-500 font-medium" onkeydown="if(event.key==='Enter') addNewCustomSubject()">
                    <button onclick="addNewCustomSubject()" class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm">
                        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        <span>新增科目</span>
                    </button>
                </div>
            </div>

            <div class="pt-2 flex justify-between items-center border-t">
                <span class="text-[11px] text-slate-400">目前啟用：<strong id="modalActiveSubCount" class="text-indigo-600">0</strong> 科</span>
                <button onclick="closeSubjectModal()" class="px-5 py-2 bg-indigo-900 text-white rounded-lg text-xs font-bold hover:bg-indigo-800 shadow">
                    儲存並更新表格
                </button>
            </div>
        </div>
    </div>

    <!-- 彈窗 2：整班學生姓名批次貼上 -->
    <div id="pasteModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-2xl border border-slate-200 space-y-3">
            <div class="flex items-center justify-between border-b pb-2">
                <h3 class="font-bold text-base text-slate-800 flex items-center gap-2">
                    <i data-lucide="clipboard" class="w-4 h-4 text-indigo-600"></i>
                    批次貼上學生姓名
                </h3>
                <button onclick="closePasteModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <p class="text-xs text-slate-500">請將學生名冊直接複製後貼在下方（一行一位學生），系統將自動為每位學生建立輸入列：</p>
            <textarea id="pasteNamesTextarea" rows="8" placeholder="林宥辰&#10;張語彤&#10;陳品睿&#10;許家豪&#10;黃子晴" class="w-full border border-slate-300 rounded-xl p-3 text-xs leading-relaxed outline-none focus:border-indigo-500 font-mono"></textarea>
            
            <div class="flex items-center justify-between pt-2">
                <label class="flex items-center gap-1.5 text-xs text-slate-600 font-medium cursor-pointer">
                    <input type="checkbox" id="overwriteExistingCheckbox" class="rounded text-indigo-600">
                    <span>清空現有表格並完全取代</span>
                </label>
                <button onclick="confirmBatchPaste()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold">
                    立即匯入表格
                </button>
            </div>
        </div>
    </div>

    <!-- 彈窗 3：歷史紀錄讀取 -->
    <div id="historyModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-md z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-3xl w-full p-6 sm:p-8 shadow-2xl border border-slate-200 flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between border-b pb-3 mb-4">
                <div class="flex items-center gap-2">
                    <span class="p-2 rounded-xl bg-amber-100 text-amber-600"><i data-lucide="folder-open" class="w-5 h-5"></i></span>
                    <h3 class="font-black text-lg text-slate-800">歷史成績紀錄管理</h3>
                </div>
                <button onclick="closeHistoryModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto pr-2">
                <div id="historyListContainer" class="space-y-3">
                    <!-- JS 動態生成歷史紀錄列表 -->
                </div>
            </div>
        </div>
    </div>

    <!-- 訊息提示 (Toast) -->
    <div id="toastMessage" class="fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl opacity-0 pointer-events-none transition-all duration-300 transform translate-y-3 z-50 flex items-center gap-2">
        <i data-lucide="info" class="w-4 h-4 text-amber-400"></i>
        <span id="toastText">訊息通知</span>
    </div>

    <!-- JavaScript 試算表核心互動邏輯 -->
    <script>
        const STORAGE_KEY = 'douliu_goode_fast_exam_v3_draft';
        const HISTORY_KEY = 'douliu_goode_exam_history';

        // 預設所有可選科目庫（包含國中、高中常用科與數理拆分科目）
        let allAvailableSubjects = ['國文', '數學', '英文', '物理', '化學', '理化', '歷史', '地理', '公民', '生物', '地科', '自然', '社會'];

        // 當前啟用顯示於大表格的科目（預設為使用者指定的 8 大科目）
        let currentActiveSubjects = ['國文', '數學', '英文', '物理', '化學', '理化', '歷史', '地理'];
        let studentRows = [];

        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            loadFromStorage();
            if (studentRows.length === 0) {
                // 預設帶入斗六顧德示範學員
                studentRows = [
                    { seat: 1, name: '林宥辰', school: '斗六國中', scores: { '國文': 96, '數學': 100, '英文': 98, '物理': 95, '化學': 94, '理化': 98, '歷史': 92, '地理': 94 }, classRank: 1, schoolRank: 2, cert: '第一名獎狀' },
                    { seat: 2, name: '張語彤', school: '正心中學', scores: { '國文': 94, '數學': 96, '英文': 100, '物理': 92, '化學': 90, '理化': 94, '歷史': 96, '地理': 95 }, classRank: 2, schoolRank: 5, cert: '前三名獎狀' },
                    { seat: 3, name: '陳品睿', school: '雲林國中', scores: { '國文': 90, '數學': 92, '英文': 94, '物理': 88, '化學': 86, '理化': 90, '歷史': 90, '地理': 88 }, classRank: 3, schoolRank: '', cert: '前三名獎狀' },
                    { seat: 4, name: '許家豪', school: '石榴國中', scores: { '國文': 86, '數學': 88, '英文': 85, '物理': 82, '化學': 84, '理化': 85, '歷史': 88, '地理': 86 }, classRank: 4, schoolRank: '', cert: '進步獎' }
                ];
            }
            renderSubjectCheckboxes();
            renderTable();
            lucide.createIcons();
        });

        // 載入與儲存 LocalStorage
        function loadFromStorage() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                if (data) {
                    const parsed = JSON.parse(data);
                    if (parsed.batchYear) document.getElementById('batchYear').value = parsed.batchYear;
                    if (parsed.batchExam) document.getElementById('batchExam').value = parsed.batchExam;
                    if (parsed.batchSchool) document.getElementById('batchSchool').value = parsed.batchSchool;
                    if (parsed.batchClass) document.getElementById('batchClass').value = parsed.batchClass;
                    if (parsed.allAvailableSubjects && Array.isArray(parsed.allAvailableSubjects)) {
                        allAvailableSubjects = parsed.allAvailableSubjects;
                    }
                    if (parsed.activeSubjects && parsed.activeSubjects.length > 0) {
                        currentActiveSubjects = parsed.activeSubjects;
                    }
                    if (parsed.studentRows) studentRows = parsed.studentRows;
                }
            } catch (e) {
                console.error(e);
            }
        }

        function autoSaveState() {
            const data = {
                batchYear: document.getElementById('batchYear').value,
                batchExam: document.getElementById('batchExam').value,
                batchSchool: document.getElementById('batchSchool').value,
                batchClass: document.getElementById('batchClass').value,
                allAvailableSubjects: allAvailableSubjects,
                activeSubjects: currentActiveSubjects,
                studentRows: studentRows
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            
            const indicator = document.getElementById('saveStatusIndicator');
            if (indicator) indicator.classList.remove('opacity-0');
        }

        // 重新渲染整張大表格
        function renderTable() {
            document.getElementById('subjectCountBadge').textContent = currentActiveSubjects.length;
            document.getElementById('studentCountText').textContent = studentRows.length;

            // 1. 產生 Header
            const headerRow = document.getElementById('tableHeaderRow');
            let headerHtml = `
                <th class="py-2.5 px-2 text-center w-12 border-r border-slate-200 bg-slate-100">座號</th>
                <th class="py-2.5 px-3 min-w-[110px] border-r border-slate-200 bg-slate-100">學生姓名</th>
                <th class="py-2.5 px-3 min-w-[110px] border-r border-slate-200 bg-slate-100">學校 (斗六)</th>
            `;

            currentActiveSubjects.forEach(sub => {
                headerHtml += `<th class="py-2.5 px-2 text-center min-w-[68px] border-r border-slate-200 bg-indigo-50/70 text-indigo-950 font-bold">${escapeHtml(sub)}</th>`;
            });

            headerHtml += `
                <th class="py-2.5 px-2 text-center min-w-[65px] border-r border-slate-200 bg-slate-100">總分</th>
                <th class="py-2.5 px-2 text-center min-w-[65px] border-r border-slate-200 bg-amber-50 text-amber-950">平均</th>
                <th class="py-2.5 px-2 text-center min-w-[60px] border-r border-slate-200 bg-slate-100">班排</th>
                <th class="py-2.5 px-2 text-center min-w-[60px] border-r border-slate-200 bg-slate-100">校排</th>
                <th class="py-2.5 px-2 text-center min-w-[100px] border-r border-slate-200 bg-amber-50 text-amber-950">獎狀 🏅</th>
                <th class="py-2.5 px-2 text-center w-12 bg-slate-100">刪除</th>
            `;
            headerRow.innerHTML = headerHtml;

            // 2. 產生資料列 (Body)
            const tbody = document.getElementById('studentTableBody');
            if (studentRows.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${currentActiveSubjects.length + 8}" class="py-8 text-center text-slate-400 font-bold">目前無學生資料，請點擊上方「新增學生」或「批次貼上姓名」</td></tr>`;
                return;
            }

            const defaultSchool = document.getElementById('batchSchool').value || '斗六國中';

            tbody.innerHTML = studentRows.map((row, rIdx) => {
                let total = 0;
                let count = 0;
                currentActiveSubjects.forEach(sub => {
                    const val = parseFloat(row.scores?.[sub]);
                    if (!isNaN(val)) {
                        total += val;
                        count++;
                    }
                });
                const avg = count > 0 ? (total / count).toFixed(1) : '-';
                row._calculatedTotal = count > 0 ? total : 0;
                row._calculatedAvg = count > 0 ? parseFloat(avg) : 0;

                // 各科輸入格
                const subjectCols = currentActiveSubjects.map(sub => {
                    const scoreVal = row.scores?.[sub] !== undefined ? row.scores[sub] : '';
                    let fontColor = 'text-slate-800';
                    if (parseFloat(scoreVal) === 100) fontColor = 'text-rose-600 font-black';
                    else if (parseFloat(scoreVal) >= 90) fontColor = 'text-emerald-600 font-bold';

                    return `
                        <td class="p-0 border-r border-slate-200 text-center">
                            <input type="number" step="0.5" min="0" max="100"
                                value="${scoreVal}"
                                placeholder="-"
                                onfocus="this.select()"
                                onkeydown="handleCellKeyNavigation(event, ${rIdx})"
                                oninput="updateScore(${rIdx}, '${escapeHtml(sub)}', this.value)"
                                class="grid-cell-input text-center ${fontColor}">
                        </td>
                    `;
                }).join('');

                return `
                    <tr class="hover:bg-blue-50/40 transition">
                        <!-- 座號 -->
                        <td class="p-0 border-r border-slate-200 text-center">
                            <input type="number" value="${row.seat !== undefined ? row.seat : (rIdx + 1)}"
                                onfocus="this.select()"
                                onchange="updateRowField(${rIdx}, 'seat', this.value)"
                                class="grid-cell-input text-center text-slate-500 font-semibold">
                        </td>
                        <!-- 姓名 -->
                        <td class="p-0 border-r border-slate-200">
                            <input type="text" value="${escapeHtml(row.name || '')}"
                                placeholder="學生姓名"
                                onfocus="this.select()"
                                onkeydown="handleCellKeyNavigation(event, ${rIdx})"
                                onchange="updateRowField(${rIdx}, 'name', this.value)"
                                class="grid-cell-input font-bold text-slate-900">
                        </td>
                        <!-- 學校 -->
                        <td class="p-0 border-r border-slate-200">
                            <input type="text" list="douliuSchoolList" value="${escapeHtml(row.school || defaultSchool)}"
                                placeholder="學校"
                                onfocus="this.select()"
                                onchange="updateRowField(${rIdx}, 'school', this.value)"
                                class="grid-cell-input text-indigo-700 font-medium">
                        </td>
                        <!-- 各科成績 -->
                        ${subjectCols}
                        <!-- 總分 (自動計算) -->
                        <td class="px-2 py-2 text-center font-bold text-slate-700 border-r border-slate-200 bg-slate-50/50">
                            ${count > 0 ? total : '-'}
                        </td>
                        <!-- 平均 (自動計算) -->
                        <td class="px-2 py-2 text-center font-black text-indigo-700 border-r border-slate-200 bg-amber-50/40">
                            ${avg}
                        </td>
                        <!-- 班排 -->
                        <td class="p-0 border-r border-slate-200 text-center">
                            <input type="number" min="1" value="${row.classRank || ''}"
                                placeholder="-"
                                onfocus="this.select()"
                                onchange="updateRowField(${rIdx}, 'classRank', this.value)"
                                class="grid-cell-input text-center font-bold ${row.classRank == 1 ? 'text-amber-600 font-black' : 'text-slate-800'}">
                        </td>
                        <!-- 校排 -->
                        <td class="p-0 border-r border-slate-200 text-center">
                            <input type="number" min="1" value="${row.schoolRank || ''}"
                                placeholder="-"
                                onfocus="this.select()"
                                onchange="updateRowField(${rIdx}, 'schoolRank', this.value)"
                                class="grid-cell-input text-center text-slate-600">
                        </td>
                        <!-- 獎狀快速切換 -->
                        <td class="px-1.5 py-1 text-center border-r border-slate-200 bg-amber-50/20">
                            <select onchange="updateRowField(${rIdx}, 'cert', this.value)" class="text-xs rounded border border-amber-300 bg-white px-1.5 py-1 font-bold text-slate-800 outline-none w-full">
                                <option value="無" ${row.cert === '無' ? 'selected' : ''}>無獎狀</option>
                                <option value="第一名獎狀" ${row.cert === '第一名獎狀' ? 'selected' : ''}>🥇 第一名</option>
                                <option value="前三名獎狀" ${row.cert === '前三名獎狀' ? 'selected' : ''}>🏅 前三名</option>
                                <option value="優異獎狀" ${row.cert === '優異獎狀' ? 'selected' : ''}>🎖 優異獎</option>
                                <option value="進步獎" ${row.cert === '進步獎' ? 'selected' : ''}>📈 進步獎</option>
                                <option value="自訂榮譽" ${['無','第一名獎狀','前三名獎狀','優異獎狀','進步獎'].indexOf(row.cert) === -1 && row.cert ? 'selected' : ''}>★ 自訂</option>
                            </select>
                        </td>
                        <!-- 刪除 -->
                        <td class="px-1 py-1 text-center">
                            <button onclick="deleteRow(${rIdx})" class="p-1 rounded text-slate-300 hover:text-rose-600 transition" title="刪除此列">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');

            lucide.createIcons();
        }

        // Enter 按鍵垂直跳到下一位學生的同一個欄位
        function handleCellKeyNavigation(event, currentRowIdx) {
            if (event.key === 'Enter') {
                event.preventDefault();
                const currentInput = event.target;
                const currentTd = currentInput.closest('td');
                if (!currentTd) return;
                const colIdx = Array.from(currentTd.parentNode.children).indexOf(currentTd);
                const nextRow = currentTd.parentNode.nextElementSibling;
                if (nextRow && nextRow.children[colIdx]) {
                    const nextInput = nextRow.children[colIdx].querySelector('input');
                    if (nextInput) {
                        nextInput.focus();
                        nextInput.select();
                    }
                } else if (!nextRow) {
                    // 若已在最後一行，按 Enter 直接自動新增一行
                    addRow();
                }
            }
        }

        // 修改資料即時觸發
        function updateScore(rowIndex, subject, value) {
            if (!studentRows[rowIndex]) return;
            if (!studentRows[rowIndex].scores) studentRows[rowIndex].scores = {};
            if (value === '') {
                delete studentRows[rowIndex].scores[subject];
            } else {
                studentRows[rowIndex].scores[subject] = parseFloat(value);
            }
            autoSaveState();
            refreshRowCalculatedStats(rowIndex);
        }

        function refreshRowCalculatedStats(rowIndex) {
            const row = studentRows[rowIndex];
            let total = 0;
            let count = 0;
            currentActiveSubjects.forEach(sub => {
                const val = parseFloat(row.scores?.[sub]);
                if (!isNaN(val)) {
                    total += val;
                    count++;
                }
            });
            row._calculatedTotal = count > 0 ? total : 0;
            row._calculatedAvg = count > 0 ? parseFloat((total / count).toFixed(1)) : 0;

            const tr = document.getElementById('studentTableBody').children[rowIndex];
            if (tr) {
                const totalCell = tr.children[3 + currentActiveSubjects.length];
                const avgCell = tr.children[4 + currentActiveSubjects.length];
                if (totalCell) totalCell.textContent = count > 0 ? total : '-';
                if (avgCell) avgCell.textContent = count > 0 ? (total / count).toFixed(1) : '-';
            }
        }

        function updateRowField(rowIndex, field, value) {
            if (!studentRows[rowIndex]) return;
            studentRows[rowIndex][field] = value;
            autoSaveState();
        }

        // 新增列操作
        function addRow() {
            const defaultSchool = document.getElementById('batchSchool').value || '斗六國中';
            studentRows.push({
                seat: studentRows.length + 1,
                name: '',
                school: defaultSchool,
                scores: {},
                classRank: '',
                schoolRank: '',
                cert: '無'
            });
            renderTable();
            autoSaveState();
            setTimeout(() => {
                const inputs = document.querySelectorAll('input[placeholder="學生姓名"]');
                if (inputs.length > 0) inputs[inputs.length - 1].focus();
            }, 50);
        }

        function addMultipleRows(count = 5) {
            const defaultSchool = document.getElementById('batchSchool').value || '斗六國中';
            for (let i = 0; i < count; i++) {
                studentRows.push({
                    seat: studentRows.length + 1,
                    name: '',
                    school: defaultSchool,
                    scores: {},
                    classRank: '',
                    schoolRank: '',
                    cert: '無'
                });
            }
            renderTable();
            autoSaveState();
            showToast(`已新增 ${count} 位學生空格！`);
        }

        function deleteRow(index) {
            studentRows.splice(index, 1);
            studentRows.forEach((r, idx) => {
                if (r.seat === undefined || r.seat === '') r.seat = idx + 1;
            });
            renderTable();
            autoSaveState();
        }

        function applyDefaultSchoolToBlankRows() {
            const school = document.getElementById('batchSchool').value;
            studentRows.forEach(r => {
                if (!r.school) r.school = school;
            });
            renderTable();
        }

        // 依照平均分數自動排名
        function autoCalculateRanks() {
            if (studentRows.length === 0) return;

            studentRows.forEach(r => {
                let total = 0, count = 0;
                currentActiveSubjects.forEach(sub => {
                    const val = parseFloat(r.scores?.[sub]);
                    if (!isNaN(val)) {
                        total += val;
                        count++;
                    }
                });
                r._tempAvg = count > 0 ? (total / count) : -1;
            });

            const sorted = [...studentRows].filter(r => r._tempAvg >= 0).sort((a, b) => b._tempAvg - a._tempAvg);

            sorted.forEach((item, index) => {
                item.classRank = index + 1;
                if (item.classRank === 1 && (!item.cert || item.cert === '無')) {
                    item.cert = '第一名獎狀';
                } else if (item.classRank <= 3 && (!item.cert || item.cert === '無')) {
                    item.cert = '前三名獎狀';
                }
            });

            renderTable();
            autoSaveState();
            showToast('已完成班級名次自動排序與前三名獎狀標註！');
        }

        // 批次貼上姓名
        function openPasteModal() {
            document.getElementById('pasteModal').classList.remove('hidden');
            document.getElementById('pasteModal').classList.add('flex');
            document.getElementById('pasteNamesTextarea').focus();
        }

        function closePasteModal() {
            document.getElementById('pasteModal').classList.add('hidden');
            document.getElementById('pasteModal').classList.remove('flex');
        }

        function confirmBatchPaste() {
            const raw = document.getElementById('pasteNamesTextarea').value;
            const names = raw.split('\n').map(n => n.trim()).filter(n => n.length > 0);
            if (names.length === 0) {
                showToast('請先貼上至少一個姓名！');
                return;
            }

            const isOverwrite = document.getElementById('overwriteExistingCheckbox').checked;
            const defaultSchool = document.getElementById('batchSchool').value || '斗六國中';

            if (isOverwrite) {
                studentRows = [];
            }

            const startSeat = studentRows.length + 1;
            names.forEach((name, idx) => {
                studentRows.push({
                    seat: startSeat + idx,
                    name: name,
                    school: defaultSchool,
                    scores: {},
                    classRank: '',
                    schoolRank: '',
                    cert: '無'
                });
            });

            document.getElementById('pasteNamesTextarea').value = '';
            closePasteModal();
            renderTable();
            autoSaveState();
            showToast(`已成功批次匯入 ${names.length} 位學生！`);
        }

        // === 科目自訂與增減管理核心 ===
        function openSubjectModal() {
            document.getElementById('subjectModal').classList.remove('hidden');
            document.getElementById('subjectModal').classList.add('flex');
            renderSubjectCheckboxes();
        }

        function closeSubjectModal() {
            document.getElementById('subjectModal').classList.add('hidden');
            document.getElementById('subjectModal').classList.remove('flex');
            renderTable();
            autoSaveState();
        }

        function renderSubjectCheckboxes() {
            const container = document.getElementById('subjectCheckboxes');
            const countSpan = document.getElementById('modalActiveSubCount');
            if (countSpan) countSpan.textContent = currentActiveSubjects.length;

            container.innerHTML = allAvailableSubjects.map(sub => {
                const isChecked = currentActiveSubjects.includes(sub);
                return `
                    <div class="flex items-center justify-between p-2 rounded-lg border ${isChecked ? 'border-indigo-300 bg-indigo-50/70 text-indigo-950 font-bold' : 'border-slate-200 bg-slate-50 text-slate-600'} select-none transition">
                        <label class="flex items-center gap-2 flex-1 cursor-pointer">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleSubject('${escapeHtml(sub)}', this.checked)" class="rounded text-indigo-600 w-4 h-4 cursor-pointer">
                            <span class="text-xs">${escapeHtml(sub)}</span>
                        </label>
                        <button type="button" onclick="deleteSubjectFromList('${escapeHtml(sub)}')" class="text-slate-300 hover:text-rose-500 p-0.5 rounded transition" title="從清單中刪除此科">
                            <i data-lucide="trash" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        function toggleSubject(subject, checked) {
            if (checked) {
                if (!currentActiveSubjects.includes(subject)) currentActiveSubjects.push(subject);
            } else {
                if (currentActiveSubjects.length <= 1) {
                    showToast('請至少保留一個考試科目！');
                    renderSubjectCheckboxes();
                    return;
                }
                currentActiveSubjects = currentActiveSubjects.filter(s => s !== subject);
            }
            const countSpan = document.getElementById('modalActiveSubCount');
            if (countSpan) countSpan.textContent = currentActiveSubjects.length;
        }

        function addNewCustomSubject() {
            const input = document.getElementById('newCustomSubjectInput');
            const val = input.value.trim();
            if (!val) {
                showToast('請輸入要新增的科目名稱');
                return;
            }
            if (!allAvailableSubjects.includes(val)) {
                allAvailableSubjects.push(val);
            }
            if (!currentActiveSubjects.includes(val)) {
                currentActiveSubjects.push(val);
            }
            input.value = '';
            renderSubjectCheckboxes();
            autoSaveState();
            showToast(`已成功新增科目「${val}」並啟用！`);
        }

        function deleteSubjectFromList(subject) {
            if (allAvailableSubjects.length <= 1) {
                showToast('至少需保留一個科目！');
                return;
            }
            // 從總庫與啟用庫中移除
            allAvailableSubjects = allAvailableSubjects.filter(s => s !== subject);
            currentActiveSubjects = currentActiveSubjects.filter(s => s !== subject);
            
            // 同時清除學員資料內該科歷史成績，維持乾淨
            studentRows.forEach(r => {
                if (r.scores && r.scores[subject] !== undefined) {
                    delete r.scores[subject];
                }
            });

            renderSubjectCheckboxes();
            renderTable();
            autoSaveState();
            showToast(`已將「${subject}」自科目庫中刪除！`);
        }

        function applyPresetSubjects(presetList) {
            // 將預設清單中缺少的自動補入 allAvailableSubjects
            presetList.forEach(sub => {
                if (!allAvailableSubjects.includes(sub)) allAvailableSubjects.push(sub);
            });
            currentActiveSubjects = [...presetList];
            renderSubjectCheckboxes();
            renderTable();
            autoSaveState();
            showToast(`已切換為：${presetList.join('、')}`);
        }

        // 匯出 Excel (CSV)
        function exportCSV() {
            if (studentRows.length === 0) {
                showToast('表格目前無資料可匯出！');
                return;
            }

            const year = document.getElementById('batchYear').value;
            const exam = document.getElementById('batchExam').value;
            const className = document.getElementById('batchClass').value;

            const headers = ['座號', '姓名', '學校', ...currentActiveSubjects, '總分', '平均', '班排名', '校排名', '獎狀紀錄'];
            
            const rows = studentRows.map((r, idx) => {
                let total = 0, count = 0;
                const subScores = currentActiveSubjects.map(sub => {
                    const score = r.scores?.[sub] !== undefined ? r.scores[sub] : '';
                    if (score !== '') {
                        total += parseFloat(score);
                        count++;
                    }
                    return score;
                });
                const avg = count > 0 ? (total / count).toFixed(1) : '';

                return [
                    r.seat !== undefined ? r.seat : (idx + 1),
                    r.name || '',
                    r.school || '',
                    ...subScores,
                    count > 0 ? total : '',
                    avg,
                    r.classRank || '',
                    r.schoolRank || '',
                    r.cert || '無'
                ].map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',');
            });

            const csvContent = '\uFEFF' + headers.join(',') + '\r\n' + rows.join('\r\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `斗六顧德_${year}_${exam}_${className}_成績單.csv`;
            a.click();
            URL.revokeObjectURL(a);
            showToast('已匯出 Excel (CSV) 檔案！');
        }

        // --- 歷史紀錄存取功能 ---
        function saveCurrentToHistory() {
            const year = document.getElementById('batchYear').value.trim();
            const exam = document.getElementById('batchExam').value.trim();
            const school = document.getElementById('batchSchool').value.trim();
            const className = document.getElementById('batchClass').value.trim();

            if (!year || !exam || !school || !className) {
                showToast('請先填寫上方完整的學年度、段考別、學校與班級資訊！');
                return;
            }

            // 使用 [年_考_校_班] 作為唯一紀錄ID
            const recordId = `${year}_${exam}_${school}_${className}`;
            const recordData = {
                id: recordId,
                timestamp: Date.now(),
                year, exam, school, className,
                allAvailableSubjects: [...allAvailableSubjects],
                activeSubjects: [...currentActiveSubjects],
                studentRows: JSON.parse(JSON.stringify(studentRows)) // 深度拷貝學生資料
            };

            let history = [];
            try {
                history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            } catch(e) { history = []; }

            const existingIdx = history.findIndex(r => r.id === recordId);
            if (existingIdx >= 0) {
                if (confirm(`紀錄「${recordId}」已存在，是否覆寫更新為目前的成績？`)) {
                    history[existingIdx] = recordData;
                } else {
                    return;
                }
            } else {
                history.push(recordData);
            }

            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            showToast(`已成功儲存成績單：${recordId}`);
        }

        function openHistoryModal() {
            document.getElementById('historyModal').classList.remove('hidden');
            document.getElementById('historyModal').classList.add('flex');
            renderHistoryList();
        }

        function closeHistoryModal() {
            document.getElementById('historyModal').classList.add('hidden');
            document.getElementById('historyModal').classList.remove('flex');
        }

        function renderHistoryList() {
            const container = document.getElementById('historyListContainer');
            let history = [];
            try {
                history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            } catch(e) { history = []; }

            if (history.length === 0) {
                container.innerHTML = '<div class="text-center py-8 text-slate-400 font-bold">目前沒有任何儲存的歷史紀錄。</div>';
                lucide.createIcons();
                return;
            }

            // 依時間排序 (新 -> 舊)
            history.sort((a, b) => b.timestamp - a.timestamp);

            container.innerHTML = history.map(r => `
                <div class="flex flex-wrap items-center justify-between gap-4 p-4 rounded-xl border border-slate-200 hover:bg-slate-50 transition">
                    <div class="flex-1 min-w-[200px]">
                        <div class="flex items-center gap-2 mb-1.5">
                            <span class="px-2 py-0.5 rounded bg-indigo-100 text-indigo-700 text-[11px] font-black">${escapeHtml(r.year)}</span>
                            <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-700 text-[11px] font-black">${escapeHtml(r.exam)}</span>
                        </div>
                        <h4 class="font-bold text-slate-800 text-base mb-1">${escapeHtml(r.school)} - ${escapeHtml(r.className)}</h4>
                        <p class="text-xs text-slate-400">上次儲存：${new Date(r.timestamp).toLocaleString('zh-TW')} | 總計：${r.studentRows ? r.studentRows.length : 0} 位學生</p>
                    </div>
                    <div class="flex items-center gap-2">
                        <button onclick="loadHistoryRecord('${r.id}')" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-xs font-bold flex items-center gap-1 shadow-sm">
                            <i data-lucide="download" class="w-4 h-4"></i>讀取
                        </button>
                        <button onclick="deleteHistoryRecord('${r.id}')" class="px-3 py-2 bg-white border border-rose-200 text-rose-500 hover:bg-rose-50 rounded-lg text-xs font-bold flex items-center justify-center shadow-sm" title="刪除此紀錄">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function loadHistoryRecord(id) {
            let history = [];
            try {
                history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            } catch(e) { history = []; }

            const record = history.find(r => r.id === id);
            if (!record) {
                showToast('找不到該筆紀錄！');
                return;
            }

            if (!confirm('讀取歷史紀錄將覆寫當前表格內容，確定要讀取嗎？')) {
                return;
            }

            // 更新 UI 頂部資訊
            document.getElementById('batchYear').value = record.year || '';
            document.getElementById('batchExam').value = record.exam || '';
            document.getElementById('batchSchool').value = record.school || '';
            document.getElementById('batchClass').value = record.className || '';

            // 更新考科狀態 (維持歷史存檔時的考科配置)
            if (record.allAvailableSubjects) allAvailableSubjects = [...record.allAvailableSubjects];
            if (record.activeSubjects) currentActiveSubjects = [...record.activeSubjects];
            
            // 更新學生成績資料
            if (record.studentRows) studentRows = JSON.parse(JSON.stringify(record.studentRows));
            else studentRows = [];

            renderSubjectCheckboxes(); // 更新彈窗內的勾選狀態
            renderTable(); // 重新渲染大表格
            autoSaveState();
            closeHistoryModal();
            showToast(`已成功載入成績單：${record.className} (${record.year})`);
        }

        function deleteHistoryRecord(id) {
            if (!confirm('確定要永久刪除這筆歷史紀錄嗎？無法復原！')) {
                return;
            }

            let history = [];
            try {
                history = JSON.parse(localStorage.getItem(HISTORY_KEY)) || [];
            } catch(e) { history = []; }

            history = history.filter(r => r.id !== id);
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            
            renderHistoryList();
            showToast('已成功刪除該筆紀錄！');
        }

        function clearAllDataConfirm() {
            if (confirm('確定要清空目前整班學生成績資料嗎？')) {
                studentRows = [];
                renderTable();
                autoSaveState();
                showToast('已清空表格');
            }
        }

        function showToast(text) {
            const toast = document.getElementById('toastMessage');
            document.getElementById('toastText').textContent = text;
            toast.classList.remove('opacity-0', 'translate-y-3');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-3');
            }, 2500);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
